{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2 class="page-title">Gerenciamento de agendamentos</h2><a href="{{url_for('dashboard')}}" class="btn btn-outline-secondary">Voltar</a></div><div class="card p-3 mb-3"><h5>Dados do agendamento</h5><form method="post" class="row g-2"><input type="hidden" name="id" id="rid"><div class="col-md-4"><label class="form-label">Data e hora</label><input class="form-control" type="datetime-local" name="data_hora" id="data_hora" required></div><div class="col-md-4"><label class="form-label">Motivo</label><input class="form-control" name="motivo" id="motivo" required></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status" id="status">{% for s in ['Agendado','Confirmado','Concluído','Cancelado'] %}<option>{{s}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Tutor</label><select class="form-select" name="tutor_id" id="tutor_id" onchange="filterPets()" required><option value="">Selecione</option>{% for t in tutors %}<option value="{{t.id}}">{{t.nome}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Pet</label><select class="form-select" name="pet_id" id="pet_id" required><option value="">Selecione o tutor primeiro</option></select></div><div class="col-12"><button class="btn btn-primary">Salvar agendamento</button><button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('rid').value='';setTimeout(filterPets,0)">Novo / Limpar</button></div></form></div><form class="input-group mb-3"><input class="form-control" name="q" value="{{q}}" placeholder="Pesquisar por data, motivo, tutor ou pet"><button class="btn btn-outline-primary">Pesquisar</button></form><div class="card p-2 table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Data e hora</th><th>Motivo</th><th>Status</th><th>Tutor</th><th>Pet</th><th>Ações</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.data_hora}}</td><td>{{r.motivo}}</td><td>{{r.status}}</td><td>{{r.tutor}}</td><td>{{r.pet}}</td><td><button class="btn btn-sm btn-outline-primary" onclick='editAppointment({{r|tojson}})'>Editar</button> <form class="d-inline" method="post" action="{{url_for('excluir_agendamento',rid=r.id)}}" onsubmit="return confirm('Excluir agendamento?')"><button class="btn btn-sm btn-outline-danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="7" class="text-center">Nenhum agendamento encontrado.</td></tr>{% endfor %}</tbody></table></div><script>const pets={{pets|tojson}};function filterPets(selected=''){const tutor=document.getElementById('tutor_id').value;const p=document.getElementById('pet_id');p.innerHTML='<option value="">Selecione</option>';pets.filter(x=>String(x.tutor_id)===String(tutor)).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.nome;p.appendChild(o)});if(selected)p.value=selected}function editAppointment(r){document.getElementById('rid').value=r.id;document.getElementById('data_hora').value=r.data_hora.replace(' ','T');document.getElementById('motivo').value=r.motivo;document.getElementById('status').value=r.status;document.getElementById('tutor_id').value=r.tutor_id;filterPets(r.pet_id);window.scrollTo({top:0,behavior:'smooth'})}</script>{% endblock %}
