<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Veterinária</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb;color:#243447}.navbar{background:#17365d}.brand{font-weight:700;letter-spacing:.3px}.card{border:0;box-shadow:0 5px 20px #17365d12;border-radius:14px}.btn-primary{background:#245b91;border-color:#245b91}.table thead{background:#eaf0f7}.page-title{color:#17365d;font-weight:700}</style></head><body>
{% if session.get('user_id') %}<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand brand" href="{{url_for('dashboard')}}">Clínica Veterinária</a><div class="d-flex gap-3 align-items-center"><span class="text-white small">Olá, {{current_user}}</span><a class="btn btn-sm btn-outline-light" href="{{url_for('logout')}}">Sair</a></div></div></nav>{% endif %}
<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}} alert-dismissible fade show">{{message}}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
