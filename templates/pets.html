{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2 class="page-title">Gerenciamento de pets</h2><a href="{{url_for('dashboard')}}" class="btn btn-outline-secondary">Voltar</a></div><div class="card p-3 mb-3"><h5>Dados do pet</h5><form method="post" class="row g-2"><input type="hidden" name="id" id="rid"><div class="col-md-4"><label class="form-label">Nome</label><input class="form-control" name="nome" id="nome" required></div><div class="col-md-4"><label class="form-label">Espécie</label><select class="form-select" name="especie" id="especie" required><option value="">Selecione</option>{% for x in ['Cachorro','Gato','Ave','Outro'] %}<option>{{x}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Raça</label><input class="form-control" name="raca" id="raca"></div><div class="col-md-4"><label class="form-label">Idade (anos)</label><input class="form-control" type="number" min="0" name="idade" id="idade"></div><div class="col-md-8"><label class="form-label">Tutor responsável</label><select class="form-select" name="tutor_id" id="tutor_id" required><option value="">Selecione</option>{% for t in tutors %}<option value="{{t.id}}">{{t.nome}}</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Salvar pet</button><button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('rid').value=''">Novo / Limpar</button></div></form></div><form class="input-group mb-3"><input class="form-control" name="q" value="{{q}}" placeholder="Pesquisar pet pelo nome"><button class="btn btn-outline-primary">Pesquisar</button></form><div class="card p-2 table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Nome</th><th>Espécie</th><th>Raça</th><th>Idade</th><th>Tutor</th><th>Ações</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.nome}}</td><td>{{r.especie}}</td><td>{{r.raca}}</td><td>{{r.idade if r.idade is not none else ''}}</td><td>{{r.tutor}}</td><td><button class="btn btn-sm btn-outline-primary" onclick='editPet({{r|tojson}})'>Editar</button> <form class="d-inline" method="post" action="{{url_for('excluir_pet',rid=r.id)}}" onsubmit="return confirm('Excluir pet?')"><button class="btn btn-sm btn-outline-danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="7" class="text-center">Nenhum pet encontrado.</td></tr>{% endfor %}</tbody></table></div><script>function editPet(r){for(const k of ['id','nome','especie','raca','idade','tutor_id'])document.getElementById(k==='id'?'rid':k).value=r[k]??'';window.scrollTo({top:0,behavior:'smooth'})}</script>{% endblock %}
