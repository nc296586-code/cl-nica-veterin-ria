{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2 class="page-title">Gerenciamento de tutores</h2><a href="{{url_for('dashboard')}}" class="btn btn-outline-secondary">Voltar</a></div>
<div class="card p-3 mb-3"><h5>Dados do tutor</h5><form method="post" class="row g-2"><input type="hidden" name="id" id="rid"><div class="col-md-6"><label class="form-label">Nome completo</label><input class="form-control" name="nome" id="nome" required></div><div class="col-md-6"><label class="form-label">CPF (fictício para demonstração)</label><input class="form-control" name="cpf" id="cpf" required></div><div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" name="telefone" id="telefone"></div><div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" id="email"></div><div class="col-12"><button class="btn btn-primary">Salvar tutor</button><button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('rid').value=''">Novo / Limpar</button></div></form></div>
<form class="input-group mb-3"><input class="form-control" name="q" value="{{q}}" placeholder="Pesquisar tutor pelo nome"><button class="btn btn-outline-primary">Pesquisar</button></form>
<div class="card p-2 table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Ações</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.nome}}</td><td>{{r.cpf}}</td><td>{{r.telefone}}</td><td>{{r.email}}</td><td><button class="btn btn-sm btn-outline-primary" onclick='editTutor({{r|tojson}})'>Editar</button> <form class="d-inline" method="post" action="{{url_for('excluir_tutor',rid=r.id)}}" onsubmit="return confirm('Excluir tutor?')"><button class="btn btn-sm btn-outline-danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="6" class="text-center text-secondary">Nenhum tutor encontrado.</td></tr>{% endfor %}</tbody></table></div>
<script>function editTutor(r){for(const k of ['id','nome','cpf','telefone','email'])document.getElementById(k==='id'?'rid':k).value=r[k]??'';window.scrollTo({top:0,behavior:'smooth'})}</script>{% endblock %}
